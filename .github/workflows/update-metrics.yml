name: Update Scholar metrics

on:
  schedule:
    - cron: "0 6 * * 2"   # every Tuesday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly "bibtexparser<2"
      - name: Fetch Scholar metrics
        run: python fetch_scholar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          git diff --cached --quiet || git commit -m "Update Scholar metrics"
          git push
